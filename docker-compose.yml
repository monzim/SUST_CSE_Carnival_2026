# QueueStorm — deploy stack.
#
# Deploy-time inputs (set in .env next to this file, never committed):
#   TRAEFIK_NETWORK  name of the existing external Traefik docker network
#   API_HOST         public hostname Traefik should route (e.g. queuestorm.example.com)
#   CERT_RESOLVER    Traefik certresolver name that issues the TLS cert
#   LLM_PROVIDER     openai (default) | anthropic | google-genai
#   LLM_MODEL        optional model override for the selected provider
#   OPENAI_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY
#                    key for the selected provider — OpenAI is the default;
#                    Gemini is geo-blocked from some regions (e.g. BD)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: queuestorm-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_MODEL: ${LLM_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - redis
    networks:
      - traefik
      - internal
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.queuestorm.rule=Host(`${API_HOST}`)
      - traefik.http.routers.queuestorm.entrypoints=websecure
      - traefik.http.routers.queuestorm.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.services.queuestorm.loadbalancer.server.port=3000

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal

networks:
  # The existing, externally-managed Traefik network. Created out-of-band:
  #   docker network create <TRAEFIK_NETWORK>
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
  internal:
    driver: bridge
